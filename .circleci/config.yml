version: 2
jobs:
  build:
    working_directory: /app
    docker:
      - image: docker:17.05.0-ce-git
    steps:
      - checkout
      - setup_remote_docker:
          version: 17.06.0-ce
      - restore_cache:
          keys:
            - v1-{{ .Branch }}
          paths:
            - ~/caches/app.tar
      - run:
          name: Load Docker image layer cache
          command: |
            set +o pipefail
            docker load -i ~/caches/app.tar | true
      - run:
          name: Build application Docker image
          command: |
            docker build --cache-from=app -t app .
      - run:
          name: Save Docker image layer cache
          command: |
            mkdir -p ~/caches
            docker save -o ~/caches/app.tar app
      - save_cache:
          key: v1-{{ .Branch }}-{{ epoch }}
          paths:
            - ~/caches/app.tar
      - deploy:
          name: Push application Docker image
          command: |
            docker login -u ${DOCKER_USER} -p ${DOCKER_PASS} ${REGISTRY_ENDPOINT}
            docker tag app "${REGISTRY_ENDPOINT}/moon20x:${CIRCLE_SHA1}"
            docker push "${REGISTRY_ENDPOINT}/moon20x:${CIRCLE_SHA1}"
            docker tag app "${REGISTRY_ENDPOINT}/moon20x:latest"
            docker push "${REGISTRY_ENDPOINT}/moon20x:latest"
